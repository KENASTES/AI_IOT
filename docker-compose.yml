services:
  mongodb:
    image: mongo:8
    volumes:
      - mongo_local_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"  # เปลี่ยนเป็น 3000 สำหรับ Next.js
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://127.0.0.1:5173 --http-host-header localhost
    network_mode: "service:webapp"
    depends_on:
      - webapp
    restart: unless-stopped

volumes:
  mongo_local_data:
