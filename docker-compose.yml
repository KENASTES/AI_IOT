services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_local_data:/data/db
    restart: unless-stopped

  webapp:
    build: .
    ports:
      - "8501:8501"
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/
    restart: unless-stopped

volumes:
  mongo_local_data: